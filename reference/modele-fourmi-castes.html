<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Castes de fourmis animées</title>
<style>
  html, body {
    margin: 0; padding: 0;
    background: #d9c199;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
  }
  #ui {
    position: absolute; top: 10px; left: 10px;
    background: rgba(0,0,0,0.55);
    padding: 10px 14px;
    border-radius: 8px;
    color: #f0e0c0;
    font-size: 13px;
    z-index: 10;
    max-width: 260px;
  }
  #ui h3 { margin: 0 0 6px 0; font-size: 14px; }
  .ligne-type {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 3px 0;
    gap: 6px;
  }
  .pastille {
    width: 10px; height: 10px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 6px;
    flex-shrink: 0;
  }
  .nom-type { flex: 1; }
  #ui button {
    background: #5a3d1e;
    color: #f0e0c0;
    border: 1px solid #8a6535;
    border-radius: 5px;
    padding: 2px 8px;
    cursor: pointer;
    font-size: 12px;
  }
  #ui button:hover { background: #7a5228; }
  #ui .global button { padding: 4px 10px; margin: 6px 4px 0 0; }
  #ui hr { border-color: #6a4d2e; margin: 8px 0; }
  #total { font-weight: bold; }
  canvas { display: block; }
</style>
</head>
<body>

<div id="ui">
  <h3>🐜 Colonie — <span id="total">0</span> fourmis</h3>
  <div id="liste-types"></div>
  <hr>
  <div class="global">
    <button onclick="ants=[]; updateCount();">Tout vider</button>
    <button onclick="Object.keys(TYPES).forEach(t => addAnts(t,3));">+3 de chaque</button>
  </div>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ---------------------------------------------------------
// CASTES — un jeu de paramètres par type de fourmi
// ---------------------------------------------------------
const TYPES = {
  ouvriere: {
    label: 'Ouvrière mineure',
    echelle: 1.0, tete: 0.85, mandibule: 0.8, patte: 1.0, abdomen: 1.0,
    vitesse: [0.7, 1.3],
    couleurAbdomen: '#1c1c1c', couleurThorax: '#6b2f18',
    couleurTete: '#241512', couleurPattes: '#3a1c12', ailes: false
  },
  cultivatrice: {
    label: 'Ouvrière cultivatrice',
    echelle: 1.15, tete: 0.9, mandibule: 1.0, patte: 0.9, abdomen: 1.25,
    vitesse: [0.35, 0.6],
    couleurAbdomen: '#2a1f10', couleurThorax: '#8a4420',
    couleurTete: '#2e1a10', couleurPattes: '#4a2414', ailes: false
  },
  nourrice: {
    label: 'Nourrice',
    echelle: 0.85, tete: 0.8, mandibule: 0.65, patte: 0.85, abdomen: 0.95,
    vitesse: [0.25, 0.45],
    couleurAbdomen: '#4a3020', couleurThorax: '#8a5030',
    couleurTete: '#3a2416', couleurPattes: '#5a3420', ailes: false
  },
  eclaireuse: {
    label: 'Éclaireuse',
    echelle: 0.95, tete: 0.85, mandibule: 0.85, patte: 1.4, abdomen: 0.9,
    vitesse: [1.3, 2.0],
    couleurAbdomen: '#1c1c1c', couleurThorax: '#6b2f18',
    couleurTete: '#241512', couleurPattes: '#3a1c12', ailes: false
  },
  soldat: {
    label: 'Soldat',
    echelle: 1.3, tete: 1.5, mandibule: 2.1, patte: 1.05, abdomen: 1.0,
    vitesse: [0.5, 0.8],
    couleurAbdomen: '#141414', couleurThorax: '#5a2010',
    couleurTete: '#1a0d08', couleurPattes: '#301810', ailes: false
  },
  soldatMajeur: {
    label: 'Soldat majeur (garde)',
    echelle: 1.65, tete: 2.1, mandibule: 2.8, patte: 1.1, abdomen: 1.05,
    vitesse: [0.3, 0.5],
    couleurAbdomen: '#0f0f0f', couleurThorax: '#4a1a0c',
    couleurTete: '#150a06', couleurPattes: '#281410', ailes: false
  },
  reine: {
    label: 'Reine',
    echelle: 1.5, tete: 1.0, mandibule: 0.9, patte: 0.85, abdomen: 2.2,
    vitesse: [0.12, 0.2],
    couleurAbdomen: '#1a1008', couleurThorax: '#5a2812',
    couleurTete: '#20120a', couleurPattes: '#3a1c12', ailes: false
  },
  male: {
    label: 'Mâle ailé',
    echelle: 1.0, tete: 0.7, mandibule: 0.5, patte: 0.9, abdomen: 0.85,
    vitesse: [0.6, 1.0],
    couleurAbdomen: '#242424', couleurThorax: '#3a2018',
    couleurTete: '#1a1008', couleurPattes: '#2a1810', ailes: true
  }
};

// ---------------------------------------------------------
// CLASSE FOURMI — modèle réutilisable, paramétré par caste
// ---------------------------------------------------------
class Fourmi {
  constructor(x, y, type) {
    const cfg = TYPES[type];
    this.type = type;
    this.cfg = cfg;
    this.x = x;
    this.y = y;
    this.angle = Math.random() * Math.PI * 2;
    this.vitesse = cfg.vitesse[0] + Math.random() * (cfg.vitesse[1] - cfg.vitesse[0]);
    this.taille = (8 + Math.random() * 2) * cfg.echelle;
    this.phase = Math.random() * Math.PI * 2;
    this.phaseAile = Math.random() * Math.PI * 2;
    this.tempsAvantVirage = Math.random() * 60;
  }

  update(dt, largeur, hauteur) {
    this.phase += this.vitesse * 0.6 * dt;
    this.phaseAile += 0.9 * dt;

    this.tempsAvantVirage -= dt;
    if (this.tempsAvantVirage <= 0) {
      this.angle += (Math.random() - 0.5) * 1.2;
      this.tempsAvantVirage = 30 + Math.random() * 60;
    }

    this.x += Math.cos(this.angle) * this.vitesse * dt;
    this.y += Math.sin(this.angle) * this.vitesse * dt;

    const marge = 20;
    if (this.x < marge) { this.x = marge; this.angle = Math.PI - this.angle; }
    if (this.x > largeur - marge) { this.x = largeur - marge; this.angle = Math.PI - this.angle; }
    if (this.y < marge) { this.y = marge; this.angle = -this.angle; }
    if (this.y > hauteur - marge) { this.y = hauteur - marge; this.angle = -this.angle; }
  }

  dessinerPatte(ctx, ax, ay, longueur, offsetPhase, cote, inclinaison) {
    const balancement = Math.sin(this.phase + offsetPhase) * 0.5;
    const angleBase = (cote > 0 ? 1.0 : -1.0) + inclinaison * cote;

    const coudeX = ax + Math.cos(angleBase + balancement * 0.4) * longueur * 0.5;
    const coudeY = ay + Math.sin(angleBase + balancement * 0.4) * longueur * 0.5 + longueur * 0.2;

    const boutX = coudeX + Math.cos(angleBase + balancement) * longueur * 0.5;
    const boutY = coudeY + Math.sin(angleBase + balancement) * longueur * 0.4 + longueur * 0.3;

    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(coudeX, coudeY);
    ctx.lineTo(boutX, boutY);
    ctx.stroke();
  }

  dessinerMandibule(ctx, mx, lt, lm, cote) {
    const base = 1.3 * lt;
    ctx.beginPath();
    ctx.moveTo(mx, cote * base);
    // bord extérieur : part en avant puis se recourbe fortement vers le centre (crochet)
    ctx.quadraticCurveTo(mx + lm * 2.6, cote * base * 0.55, mx + lm * 3.6, cote * 0.15);
    // pointe très recourbée vers l'intérieur
    ctx.quadraticCurveTo(mx + lm * 2.5, cote * base * 0.15, mx + lm * 2.9, cote * -0.35);
    // bord intérieur : revient vers la base, plus épais
    ctx.quadraticCurveTo(mx + lm * 1.8, cote * base * 0.75, mx, cote * base * 0.5);
    ctx.closePath();
    ctx.fill();
  }

  draw(ctx) {
    const cfg = this.cfg;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    ctx.scale(this.taille / 10, this.taille / 10);

    const lp = cfg.patte;  // échelle des pattes
    const lt = cfg.tete;   // échelle de la tête
    const lm = cfg.mandibule; // échelle des mandibules
    const la = cfg.abdomen; // échelle de l'abdomen

    ctx.lineWidth = 1.1;
    ctx.strokeStyle = cfg.couleurPattes;

    // --- Ailes (mâles uniquement), dessinées avant le corps, en dessous ---
    if (cfg.ailes) {
      const battement = Math.sin(this.phaseAile) * 0.5 + 0.5;
      ctx.fillStyle = 'rgba(230,230,240,0.35)';
      ctx.strokeStyle = 'rgba(120,120,130,0.5)';
      ctx.lineWidth = 0.4;
      [1, -1].forEach(cote => {
        ctx.beginPath();
        ctx.ellipse(-1, cote * 2, 8, 2.4, cote * (0.15 + battement * 0.05), 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      });
    }

    // --- Pattes : 3 de chaque côté, ancrées près du thorax ---
    ctx.strokeStyle = cfg.couleurPattes;
    this.dessinerPatte(ctx, 3, 1.5, 11 * lp, 0, 1, -0.7);
    this.dessinerPatte(ctx, 1, 2, 11 * lp, Math.PI, 1, 0.1);
    this.dessinerPatte(ctx, -1, 1.8, 10 * lp, 0, 1, 0.9);

    this.dessinerPatte(ctx, 3, -1.5, 11 * lp, Math.PI, -1, -0.7);
    this.dessinerPatte(ctx, 1, -2, 11 * lp, 0, -1, 0.1);
    this.dessinerPatte(ctx, -1, -1.8, 10 * lp, Math.PI, -1, 0.9);

    // --- Antennes ---
    const antOsc = Math.sin(this.phase * 0.7) * 0.15;
    const teteX = 8;
    ctx.beginPath();
    ctx.moveTo(teteX + 1, -1.3 * lt);
    ctx.lineTo(teteX + 3.5, -3 + antOsc * 3);
    ctx.lineTo(teteX + 7, -2.5 + antOsc * 4);
    ctx.moveTo(teteX + 1, 1.3 * lt);
    ctx.lineTo(teteX + 3.5, 3 - antOsc * 3);
    ctx.lineTo(teteX + 7, 2.5 - antOsc * 4);
    ctx.stroke();

    // --- Abdomen (gaster) ---
    ctx.fillStyle = cfg.couleurAbdomen;
    ctx.beginPath();
    ctx.ellipse(-6, 0, 5.5 * la, 4.2 * Math.min(la, 1.4), 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.beginPath();
    ctx.ellipse(-6, -1.3 * la, 2.5 * la, 1.3 * Math.min(la, 1.4), 0, 0, Math.PI * 2);
    ctx.fill();

    // --- Thorax (mesosoma) ---
    ctx.fillStyle = cfg.couleurThorax;
    ctx.beginPath();
    ctx.ellipse(1, 0, 3.2, 2.3, 0, 0, Math.PI * 2);
    ctx.fill();

    // --- Tête, à l'avant, taille variable selon la caste ---
    ctx.fillStyle = cfg.couleurTete;
    ctx.beginPath();
    ctx.ellipse(teteX, 0, 3.2 * lt, 2.7 * lt, 0, 0, Math.PI * 2);
    ctx.fill();

    // --- Mandibules en crochet, taille variable (énormes chez le soldat majeur) ---
    const mx = teteX + 2.5 * lt;
    ctx.fillStyle = cfg.couleurTete;
    this.dessinerMandibule(ctx, mx, lt, lm, -1);
    this.dessinerMandibule(ctx, mx, lt, lm, 1);

    ctx.restore();
  }
}

// ---------------------------------------------------------
// GESTION DE LA SCÈNE : plusieurs castes en mouvement
// ---------------------------------------------------------
let ants = [];

function addAnts(type, n) {
  for (let i = 0; i < n; i++) {
    ants.push(new Fourmi(
      Math.random() * canvas.width,
      Math.random() * canvas.height,
      type
    ));
  }
  updateCount();
}

function removeAnts(type, n) {
  let retire = 0;
  for (let i = ants.length - 1; i >= 0 && retire < n; i--) {
    if (ants[i].type === type) { ants.splice(i, 1); retire++; }
  }
  updateCount();
}

function updateCount() {
  document.getElementById('total').textContent = ants.length;
  Object.keys(TYPES).forEach(type => {
    const n = ants.filter(a => a.type === type).length;
    const el = document.getElementById('n-' + type);
    if (el) el.textContent = n;
  });
}

// Construction du panneau UI avec une ligne par caste
const listeDiv = document.getElementById('liste-types');
Object.entries(TYPES).forEach(([type, cfg]) => {
  const ligne = document.createElement('div');
  ligne.className = 'ligne-type';
  ligne.innerHTML = `
    <span class="pastille" style="background:${cfg.couleurThorax}"></span>
    <span class="nom-type">${cfg.label} (<span id="n-${type}">0</span>)</span>
    <button onclick="addAnts('${type}',1)">+1</button>
    <button onclick="removeAnts('${type}',1)">-1</button>
  `;
  listeDiv.appendChild(ligne);
});

// Population initiale : une petite colonie variée
addAnts('ouvriere', 10);
addAnts('cultivatrice', 5);
addAnts('nourrice', 4);
addAnts('eclaireuse', 4);
addAnts('soldat', 4);
addAnts('soldatMajeur', 1);
addAnts('reine', 1);
addAnts('male', 2);

function loop() {
  ctx.fillStyle = '#d9c199';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (const f of ants) {
    f.update(1, canvas.width, canvas.height);
    f.draw(ctx);
  }

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
