<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ant Commander – La Guerre des Colonies</title>
<meta name="description" content="Jeu de stratégie en temps réel : commandez une colonie de fourmis, récoltez des ressources, construisez et défendez votre reine.">
<meta name="theme-color" content="#3a2818">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">

<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/mobile.css">
<link rel="stylesheet" href="css/menu.css">
</head>
<body>

<!-- Écran de chargement, masqué dès que le jeu est prêt (voir main.js) -->
<div id="ecran-chargement">
  <img src="assets/icons/icon-192.png" alt="Ant Commander">
  <h1>Ant Commander<br><small>La Guerre des Colonies</small></h1>
  <p>Chargement...</p>
</div>

<!-- Indicateur de connexion, mis à jour par main.js -->
<div id="statut-reseau" class="hors-ligne">
  <span class="pastille"></span>
  <span id="statut-reseau-texte">Vérification...</span>
</div>

<canvas id="canvas-jeu"></canvas>

<!-- ===========================================================
     INTERFACE TACTILE (vague 13) — construite entièrement par
     js/ui.js. Le HTML ci-dessous ne contient que les conteneurs
     vides ; aucun bouton n'est câblé ici pour garder tout le
     comportement dans un seul fichier facile à auditer.
     =========================================================== -->

<!-- Barre de ressources compacte, en haut, sous statut-reseau -->
<div id="barre-ressources" aria-hidden="true"></div>

<!-- Panneau extensible (production / construction / recherche /
     missions / partie), affiché juste au-dessus de la barre d'outils -->
<div id="panneau-menu" class="masque"></div>

<!-- Barre d'outils compacte, en bas, toujours visible -->
<nav id="barre-outils" aria-label="Menu du jeu"></nav>

<!-- Bouton plein écran, coin haut-gauche pour ne pas gêner le statut réseau -->
<button id="bouton-plein-ecran" aria-label="Plein écran" title="Plein écran">⛶</button>

<!-- Boîte de dialogue générique (confirmation mission / nouvelle
     partie / quitter), un seul gabarit réutilisé pour toutes -->
<div id="boite-dialogue" class="masque">
  <div class="boite-dialogue-contenu">
    <p id="boite-dialogue-texte"></p>
    <div class="boite-dialogue-actions">
      <button id="boite-dialogue-annuler" class="bouton-secondaire"></button>
      <button id="boite-dialogue-confirmer" class="bouton-principal"></button>
    </div>
  </div>
</div>

<!-- Ordre important : config/utils/state d'abord (aucun appel de fonction
     immédiat), puis camera/input/renderer (définissent des fonctions
     utilisées par main.js), et main.js en dernier car il orchestre tout
     le reste dès son chargement (enregistrerServiceWorker(), initialiserInput(),
     boucle() sont appelés immédiatement). js/ui.js vient tout en dernier :
     il ne fait que lire l'état et appeler les fonctions déjà définies par
     les modules précédents, jamais l'inverse. -->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/state.js"></script>
<script src="js/camera.js"></script>
<script src="js/input.js"></script>
<script src="js/resources.js"></script>
<script src="js/units.js"></script>
<script src="js/buildings.js"></script>
<script src="js/defenses.js"></script>
<script src="js/research.js"></script>
<script src="js/combat.js"></script>
<script src="js/colonies.js"></script>
<script src="js/superarme.js"></script>
<script src="js/missions.js"></script>
<script src="js/storage.js"></script>
<script src="js/renderer.js"></script>
<script src="js/main.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
