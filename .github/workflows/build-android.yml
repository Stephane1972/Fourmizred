name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java (nécessaire pour Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer les dépendances npm
        run: npm install

      - name: Préparer les assets web (www/ à partir de index.html)
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Ajouter la plateforme Android à Capacitor
        run: npx cap add android

      - name: Synchroniser Capacitor avec le projet Android
        run: npx cap sync android

      - name: Compiler l'APK (debug, signé automatiquement pour tester/installer directement)
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Récupérer l'APK compilé
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Fourmizred-build${{ github.run_number }}.apk

      - name: Publier une Release GitHub avec l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Fourmizred — build ${{ github.run_number }}"
          body: "APK généré automatiquement depuis le commit ${{ github.sha }}. À installer directement sur Android (autoriser les sources inconnues lors de l'installation)."
          files: Fourmizred-build${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
