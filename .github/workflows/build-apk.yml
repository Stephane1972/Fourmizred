# ===========================================================
# BUILD APK — compile automatiquement le projet Android (android/,
# vague 14) et publie l'APK obtenu en Release GitHub, avec un lien
# de téléchargement stable (pas besoin d'installer Android Studio
# pour simplement récupérer le fichier .apk).
#
# Se déclenche uniquement quand quelque chose qui affecte réellement
# l'APK a changé (le jeu web embarqué, ou le projet Android
# lui-même), ou manuellement depuis l'onglet "Actions" du dépôt.
#
# Build "debug" uniquement (signature de développement automatique) :
# suffisant pour installer/tester sur un téléphone, pas pour publier
# sur le Play Store. Voir android/README-APK.md, section 10, pour un
# build "release" signé.
# ===========================================================
name: Build APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "js/**"
      - "css/**"
      - "index.html"
      - "manifest.webmanifest"
      - "assets/icons/**"
      - "scripts/copier-assets-android.sh"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

# Nécessaire pour que ce workflow puisse créer une Release GitHub.
permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Le SDK Android n'est PAS installé explicitement ici : les runners
      # GitHub "ubuntu-latest" en fournissent déjà un, complet (plateformes
      # et build-tools récents, licences déjà acceptées) — c'est d'ailleurs
      # ainsi que fonctionnait le tout premier pipeline Android de ce
      # dépôt (workflow "Build Android APK", historique antérieur à la
      # VAGUE 1 de la série actuelle). Réinstaller un second SDK par-dessus
      # (ex. via android-actions/setup-android) risque de faire pointer
      # ANDROID_HOME vers un autre emplacement que celui réellement utilisé
      # par Gradle, sans aucun bénéfice ici.
      - name: Vérifier les licences du SDK Android déjà présent
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          # Version fixée explicitement (au lieu de laisser l'action
          # choisir) pour rester alignée avec android/gradle/wrapper/
          # gradle-wrapper.properties (utilisé par Android Studio en
          # local) et avec le plugin Android 8.5.2 (android/build.gradle),
          # qui requiert Gradle 8.7 ou plus récent.
          gradle-version: "8.7"

      - name: Copier le jeu web dans les assets Android
        # Fait aussi automatiquement par la tâche "copierAssetsWeb"
        # (voir android/app/build.gradle, dépendance de preBuild) —
        # exécuté ici explicitement pour que l'étape soit visible dans
        # les journaux du workflow.
        run: ./scripts/copier-assets-android.sh

      - name: Compiler l'APK (debug)
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee ../build-log-diagnostic.txt

      # ---------------------------------------------------------
      # ÉTAPE DE DIAGNOSTIC TEMPORAIRE — à retirer une fois le pipeline
      # confirmé fonctionnel. Publie le journal de compilation complet
      # comme fichier du dépôt (au lieu d'un artefact/log Actions, non
      # accessibles par ailleurs) uniquement quand la compilation a
      # échoué, pour permettre un diagnostic précis à distance.
      # ---------------------------------------------------------
      - name: "[Diagnostic] Publier le journal en cas d'échec"
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f build-log-diagnostic.txt
          git commit -m "CI [diagnostic] : journal de compilation (run ${{ github.run_number }}, echec)" || echo "Rien a committer"
          git push

      - name: Lire la version du jeu (js/config.js)
        id: version
        run: |
          VERSION=$(grep -oE 'VERSION_JEU = "[^"]+"' js/config.js | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publier l'APK en Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: "Ant Commander — APK v${{ steps.version.outputs.version }} (build ${{ github.run_number }})"
          body: |
            APK Android généré automatiquement depuis le commit
            ${{ github.sha }} (build debug, non signé — voir
            android/README-APK.md, section 10, pour un build release
            signé destiné au Play Store).

            Installation : téléchargez `app-debug.apk` ci-dessous,
            transférez-le sur votre téléphone Android, puis ouvrez-le
            (autorisation "installer des applications inconnues"
            requise la première fois).
          files: android/app/build/outputs/apk/debug/app-debug.apk
